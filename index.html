<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maomao's Capsule Machine</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌿 Maomao's Capsule Machine</h1>

    <p class="subtitle">
        How are you feeling today?
    </p>

    <div class="emotion-grid">

        <button class="emotion happy" data-emotion="happy">
            🟡 Happy
        </button>

        <button class="emotion loved" data-emotion="loved">
            🩷 Loved
        </button>

        <button class="emotion calm" data-emotion="calm">
            🔵 Calm
        </button>

        <button class="emotion lonely" data-emotion="lonely">
            🟣 Lonely
        </button>

        <button class="emotion angry" data-emotion="angry">
            🔴 Angry
        </button>

        <button class="emotion excited" data-emotion="excited">
            🟢 Excited
        </button>

        <button class="emotion surprise" data-emotion="surprise">
            🎲 Surprise
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
